name: 三端打包发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: 创建 Release(显式 gh)
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "=== 仓库权限 ==="
          gh api /repos/${{ github.repository }} --jq '.permissions | to_entries | map(select(.value==true)) | map(.key) | join(",")'
          echo "=== 创建 release ==="
          gh release create "${{ github.ref_name }}" \
            --title "一人公司智能体 ${{ github.ref_name }}" \
            --notes "三端打包发布(CI 自动构建)" --draft
          RID=$(gh release view "${{ github.ref_name }}" --json id --jq .id)
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"
          echo "创建成功 release_id=$RID"

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: 构建并上传产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
